name: Publish NuGet Packages

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
      contents: read
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Determine Next Package Version (v1.x with rollover at 15)
      id: get_version
      run: |
        LATEST=$(curl -s "https://api.nuget.org/v3-flatcontainer/icot.core/index.json" | jq -r '.versions[]?' | grep -E '^1\.' | sort -V | tail -n 1 || true)
        
        if [ -z "$LATEST" ]; then
          echo "No 1.x version found on NuGet.org. Starting initial v1 release with: 1.0.1"
          NEXT_VERSION="1.0.1"
        else
          echo "Latest published 1.x version is: $LATEST"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
          PATCH=$(( PATCH + 1 ))
          
          # Roll over to next minor when patch reaches 15
          if [ "$PATCH" -ge 15 ]; then
            MINOR=$(( MINOR + 1 ))
            PATCH=1
          fi
          
          NEXT_VERSION="1.${MINOR}.${PATCH}"
        fi
        
        echo "Calculated Target Version: $NEXT_VERSION"
        echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT

    - name: Restore dependencies
      run: dotnet restore ICOT.Core/ICOT.Core.csproj

    - name: Pack ICOT.Core
      run: dotnet pack ICOT.Core/ICOT.Core.csproj -c Release -p:PackageVersion=${{ steps.get_version.outputs.version }} -p:ContinuousIntegrationBuild=true -o ./artifacts

    - name: Push packages to NuGet.org
      run: dotnet nuget push ./artifacts/*.nupkg --source "https://api.nuget.org/v3/index.json" --skip-duplicate --api-key ${{secrets.NUGET_API_KEY}}
